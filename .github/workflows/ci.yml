name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Reads the exact pnpm version from package.json's packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm lint
      - run: pnpm test

  ui-e2e:
    timeout-minutes: 15
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ui

  bundle:
    timeout-minutes: 45
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
            artifact: apps/desktop/src-tauri/target/release/bundle/RelayIt.app.tar.gz
          - os: windows-latest
            bundles: nsis
            artifact: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm --filter @relayit/desktop tauri build --bundles ${{ matrix.bundles }}
      # Preserve executable bits and symlinks inside the macOS app artifact.
      - if: runner.os == 'macOS'
        run: tar -czf apps/desktop/src-tauri/target/release/bundle/RelayIt.app.tar.gz -C apps/desktop/src-tauri/target/release/bundle/macos RelayIt.app
      - uses: actions/upload-artifact@v4
        with:
          name: relayit-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
